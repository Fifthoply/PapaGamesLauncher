<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa Games Offline</title>
    <style>
        /* ---------- Local Poppins Fonts ---------- */
        @font-face {
            font-family: 'Poppins';
            src: url('Poppins-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }
        @font-face {
            font-family: 'Poppins';
            src: url('Poppins-ExtraBold.ttf') format('truetype');
            font-weight: 800;
            font-style: normal;
        }

        /* ---------- Rest of your original CSS (unchanged) ---------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .app-window {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4 / 3;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .header {
            background-color: #1509a2;
            color: #ffffff;
            text-align: center;
            padding: 12px 10px;
            width: 100%;
            z-index: 10;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.4;
            letter-spacing: 0.5px;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            z-index: 10;
        }

        .instruction-text {
            color: #000000;
            font-size: 16.5px;
            font-weight: 800;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 0.2px;
        }

        .dropdown-wrapper {
            position: relative;
            width: 290px;
            height: 38px;
            border: 2px solid #000000;
            border-radius: 8px;
            background-color: #ffffff;
            margin-bottom: 25px;
        }

        .game-select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0 50px 0 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #000000;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .game-select:focus {
            outline: none;
        }

        .dropdown-graphics {
            position: absolute;
            top: 0;
            right: 0;
            width: 48px;
            height: 100%;
            border-left: 2px solid #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
            pointer-events: none;
        }

        .dropdown-graphics span {
            font-size: 16px;
            font-weight: 800;
            color: #000000;
            margin-top: 2px;
        }

        .launch-btn {
            background-color: #1509a2;
            color: #ffffff;
            border: none;
            border-radius: 999px;
            padding: 8px 0;
            width: 170px;
            font-family: 'Poppins', sans-serif;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s;
            letter-spacing: 0.5px;
        }

        .launch-btn:hover {
            background-color: #0f0680;
        }

        .bottom-image {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 75%;
            z-index: 1;
        }

        .bottom-image img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="app-window">
        <header class="header">
            <h1>¡Bienvenido al Cliente offline de Papa<br>Games!</h1>
        </header>

        <main class="content">
            <p class="instruction-text">Por favor elija un juego para lanzar:</p>

            <div class="dropdown-wrapper">
                <select class="game-select" name="game">
                    <option value="" disabled selected>Ningún juego elegido</option>
                    <option value="cucharas_ultra">Atrapa las Cucharas Ultra Dificil</option>
                    <option value="cucharas">Atrapa las Cucharas!</option>
                    <option value="cocodriliano">Evita a Cocodriliano!</option>
                    <option value="space_fighting">Papa's Space Fighting (solo PC)</option>
                    <option value="papa_running">Papa Running (solo PC)</option>
                </select>
                <div class="dropdown-graphics"><span>V</span></div>
            </div>

            <button class="launch-btn">Lanzar</button>
        </main>

        <div class="bottom-image">
            <img src="logo.png" alt="Logo" />
        </div>
    </div>

    <!-- QWebChannel integration -->
    <script>
        function initQWebChannel() {
            new QWebChannel(qt.webChannelTransport, function(channel) {
                window.backend = channel.objects.backend;
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof QWebChannel !== 'undefined') {
                initQWebChannel();
            } else {
                setTimeout(function() {
                    if (typeof QWebChannel !== 'undefined') initQWebChannel();
                    else console.error("QWebChannel not found.");
                }, 500);
            }
        });

        document.querySelector('.launch-btn').addEventListener('click', () => {
            const select = document.querySelector('.game-select');
            const selectedGame = select.value;
            if (!selectedGame) {
                alert("Por favor elija un juego primero.");
                return;
            }
            if (window.backend) {
                window.backend.launch_game(selectedGame);
            } else {
                console.error("Backend not connected.");
            }
        });
    </script>
</body>
</html>
